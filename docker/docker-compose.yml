version: '2'

services:
  panda_ros2:
    build:
      context: .
      dockerfile: Dockerfile
      network: "host"
      args:
        - https_proxy=${https_proxy}
        - USER_UID=${USER_UID:?error}
        - USER_GID=${USER_GID:?error}
        - USERNAME=${USERNAME:?error}
        - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:?error}
    container_name: panda_ros2
    network_mode: "host"
    privileged: true
    command: /bin/bash
    tty: true
    stdin_open: true
    volumes:
      - ../:/home/${USERNAME}/ros2_ws/src/franka_ros2
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./limits.conf:/etc/security/limits.conf
      - .vscode-server:/home/${USERNAME}/.vscode-server:rw
      - .vscode:/home/${USERNAME}/ros2_ws/.vscode:rw
    environment:
      QT_X11_NO_MITSHM: 1
      DISPLAY: $DISPLAY
      TERM: xterm-256color
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:?error}
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      rttime: -1
      memlock: 8428281856